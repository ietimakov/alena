<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Алёна Урсова — контакты</title>
  <style>
    @font-face {
      font-family: "Rochelle";
      src: url("../../fonts/rochelle.otf") format("opentype");
      font-display: swap;
    }

    @font-face {
      font-family: "Calibri Local";
      src: url("../../fonts/calibri.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --paper: #f3f3f3;
      --olive: #858b7c;
      --ink: #181713;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-width: 320px;
      overflow-x: clip;
      background: var(--paper);
      color: var(--ink);
    }

    body { font-family: "Calibri Local", Calibri, Arial, sans-serif; }

    .contact {
      position: relative;
      width: 100%;
      min-height: 520px;
      overflow: hidden;
      background: var(--paper);
    }

    .contact-disc {
      position: absolute;
      top: 0;
      left: 50%;
      width: min(610px, calc(100% - 36px));
      height: 420px;
      padding-top: 135px;
      transform: translateX(-50%);
      border-radius: 0 0 50% 50%;
      background: var(--olive);
      color: #fff;
      text-align: center;
    }

    .vine {
      position: absolute;
      top: 38px;
      left: 50%;
      width: min(430px, 82%);
      height: 58px;
      transform: translateX(-50%);
      background: url("../../images/decor/vine.png") center / contain no-repeat;
      filter: brightness(.2);
    }

    .contact-title {
      position: relative;
      display: inline-grid;
      justify-items: center;
    }

    h1 {
      margin: 0;
      font: 400 96px/.9 "Rochelle", serif;
      white-space: nowrap;
    }

    .contact-underline {
      position: relative;
      width: 92%;
      height: 24px;
      margin-top: 7px;
      color: var(--ink);
    }

    .contact-underline::before {
      content: "";
      position: absolute;
      top: 4px;
      right: 0;
      left: 0;
      height: 18px;
      transform: scaleX(0);
      transform-origin: left center;
      background: #fff;
      clip-path: polygon(0 54%,14% 42%,29% 50%,45% 37%,62% 48%,79% 35%,100% 47%,100% 61%,79% 51%,62% 64%,45% 52%,29% 65%,14% 57%,0 68%);
      animation: contact-stroke 3.5s ease-in-out infinite;
    }

    .brush {
      position: absolute;
      z-index: 2;
      top: -7px;
      left: -10px;
      width: 25px;
      height: 25px;
      filter: drop-shadow(0 2px 1px rgb(0 0 0 / 18%));
      animation: contact-brush 3.5s ease-in-out infinite;
    }

    .contacts {
      position: absolute;
      top: 466px;
      left: 50%;
      display: flex;
      width: min(1180px, calc(100% - 48px));
      align-items: center;
      justify-content: center;
      gap: clamp(44px, 7vw, 110px);
      transform: translateX(-50%);
      font-size: 18px;
    }

    .contacts a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      transition: color .2s ease, transform .2s ease;
    }

    .contacts svg {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
    }

    .contacts a:hover { color: var(--olive); transform: translateY(-2px); }
    .contacts a:focus-visible { outline: 2px solid var(--olive); outline-offset: 6px; }

    @keyframes contact-stroke {
      0% { transform: scaleX(0); opacity: 1; }
      45%, 65% { transform: scaleX(1); opacity: 1; }
      85%, 100% { transform: scaleX(1); opacity: 0; }
    }

    @keyframes contact-brush {
      0% { left: -10px; opacity: 1; transform: rotate(-28deg); }
      45% { left: calc(100% - 12px); opacity: 1; transform: rotate(-12deg); }
      52%, 100% { left: calc(100% - 12px); opacity: 0; transform: rotate(-12deg); }
    }

    @media (max-width: 700px) {
      .contact { min-height: 400px; }

      .contact-disc {
        width: min(420px, calc(100% - 24px));
        height: 390px;
        padding-top: 65px;
      }

      .vine {
        top: 8px;
        width: min(430px, 96%);
        filter: none;
      }

      h1 { font-size: clamp(50px, 15vw, 64px); }

      .contacts {
        top: 185px;
        flex-direction: column;
        width: 100%;
        gap: 12px;
        padding-inline: 20px;
        font-size: 14px;
      }

      .contacts a { color: #fff; }
      .contacts a:hover { color: #fff; }
      .contacts svg { width: 24px; height: 24px; flex-basis: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .contact-underline::before { animation: none; transform: none; opacity: 1; }
      .brush { left: calc(100% - 12px); animation: none; opacity: 1; transform: rotate(-12deg); }
    }
  </style>
</head>
<body>
  <section class="contact" aria-labelledby="contact-heading">
    <div class="contact-disc">
      <div class="vine" aria-hidden="true"></div>
      <div class="contact-title">
        <h1 id="contact-heading">CONTACT ME</h1>
        <div class="contact-underline" aria-hidden="true">
          <svg class="brush" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M7.7 14.8c1.5-1.6 4.2-1.8 5.8-.3 1.8 1.6 1.4 4.7-.3 6.2-1.8 1.7-5.3 1.8-8.4 1.1 1.7-1.1 2.1-2.5 2.2-3.8.1-1.2-.1-2.2.7-3.2Z"/>
            <path d="m12.5 14.1 7.4-11c.7-1 .6-2.1-.1-2.7-.8-.6-1.9-.3-2.6.6l-7.5 11.2 2.8 1.9Z"/>
          </svg>
        </div>
      </div>
    </div>

    <nav class="contacts" aria-label="Контакты Алёны Урсовой">
      <a href="mailto:ursova.al@mail.ru" aria-label="Написать Алёне по электронной почте">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg>
        <span>ursova.al@mail.ru</span>
      </a>
      <a href="https://wa.me/79613698369" target="_blank" rel="noopener noreferrer" aria-label="Написать Алёне в WhatsApp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.6A8.5 8.5 0 0 1 7.9 19l-4.4 1.3 1.4-4.2A8.5 8.5 0 1 1 20.5 11.6Z"/><path d="M8.2 7.7c.3-.4.6-.4.9-.1l1.2 1.7c.2.3.1.6-.1.9l-.7.8c.8 1.6 2 2.8 3.7 3.6l.8-.9c.2-.3.5-.3.8-.2l1.9.9c.3.2.4.5.3.8-.4 1.3-1.4 2-2.8 2-3.8-.4-7.7-4.4-8-8.1 0-.7.3-1.1.6-1.4Z"/></svg>
        <span>8(961)369-8-369</span>
      </a>
      <a href="https://t.me/Alena_Ursova" target="_blank" rel="noopener noreferrer" aria-label="Написать Алёне в Telegram">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 3.3 18.4 20c-.2 1.2-.9 1.5-1.8.9l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6 13.8 1.2 12.3c-1.1-.3-1.1-1.1.2-1.6L20 3.5c.9-.3 1.7.2 1.6-.2Z"/></svg>
        <span>@Alena_Ursova</span>
      </a>
    </nav>
  </section>

  <script>
    (() => {
      const sendHeight = () => {
        window.parent.postMessage({
          type: "alena-contact-height",
          height: document.documentElement.scrollHeight
        }, "*");
      };

      window.addEventListener("load", sendHeight);
      window.addEventListener("resize", sendHeight);
      document.fonts?.ready.then(sendHeight);
    })();
  </script>
</body>
</html>
